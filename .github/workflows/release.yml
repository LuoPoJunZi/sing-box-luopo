name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch: # 手动触发按钮

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        # 【修复1】升级到 v4，消除黄牌警告
        uses: actions/checkout@v4 

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep -oP '^is_sh_ver="\K[^"]+' src/init.sh)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Check if Release is Needed
        id: check_release
        run: |
          if [ "${{ env.VERSION }}" == "${{ env.LATEST_TAG }}" ]; then
            echo "版本 ${{ env.VERSION }} 已存在，无需发布新 Release。自动跳过。"
            echo "should_release=false" >> $GITHUB_ENV
          else
            echo "检测到新版本: ${{ env.VERSION }}。准备自动发布！"
            echo "should_release=true" >> $GITHUB_ENV
          fi

      - name: Package Code
        if: env.should_release == 'true'
        # 【修复2】将 --exclude 放在最前面，彻底解决 Exit code 2 崩溃问题
        run: tar --exclude="./.git" --exclude="./.github" --exclude="./code.tar.gz" -zcvf code.tar.gz .

      - name: Create Release
        if: env.should_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: code.tar.gz
          tag_name: ${{ env.VERSION }}
          name: Sing-box-LuoPo ${{ env.VERSION }}
          body: "🤖 自动化构建发布版本: ${{ env.VERSION }}"