name: Auto Release

on:
  push:
    branches:
      - main
    paths:
      # 仅当 src/ 目录下的核心文件变动时才触发检查，节省 Actions 额度
      - 'src/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Extract Version
        id: get_version
        # 精准提取 src/init.sh 中的版本号 (如 v1.0)
        run: |
          VERSION=$(grep -oP '^is_sh_ver="\K[^"]+' src/init.sh)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV

      - name: Check if Release is Needed
        id: check_release
        run: |
          if [ "${{ env.VERSION }}" == "${{ env.LATEST_TAG }}" ]; then
            echo "版本 ${{ env.VERSION }} 已存在，无需发布新 Release。自动跳过。"
            echo "should_release=false" >> $GITHUB_ENV
          else
            echo "检测到新版本: ${{ env.VERSION }}。准备自动发布！"
            echo "should_release=true" >> $GITHUB_ENV
          fi

      - name: Package Code
        if: env.should_release == 'true'
        # 排除掉不需要被用户下载的 GitHub Actions 隐藏文件夹
        run: tar zcvf code.tar.gz ./* --exclude=code.tar.gz --exclude=.git --exclude=.github

      - name: Create Release
        if: env.should_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: code.tar.gz
          tag_name: ${{ env.VERSION }}
          name: Sing-box-LuoPo ${{ env.VERSION }}
          body: "🤖 自动化构建发布版本: ${{ env.VERSION }}"
